name: coreutils
version: 0.5.0.0
synopsis: Unix core utilities implemented in Haskell
description: Please see README.md
homepage: https://public.anardil.net/code/coreutils
license: BSD-3-Clause
author: Austin
maintainer: austin@anardil.net
copyright: 2022, Austin
category: Utility

flags:
  release:
    description: for installation
    default: false
    manual: true

library:
  source-dirs: .
  default-extensions:
    - StrictData
    - RecordWildCards
  ghc-options:
    - -Wall
    - -j4
  when:
    - condition: flag(release)
      ghc-options: -O2
    - condition: "!flag(release)"
      ghc-options: -O0
  dependencies:
    - array
    - base >= 4.7 && < 5
    - bytestring
    - containers
    - directory
    - extra
    - mtl
    - network
    - parsec
    - process
    - random-shuffle
    - random
    - regex-tdfa >= 1.3.1.1
    - resourcet
    - split
    - streaming-bytestring
    - streaming
    - text
    - time
    - unordered-containers
    - word8

executables:
  utils:
    main: main.hs
    source-dirs: src
    ghc-options: -Wall
    when:
      - condition: flag(release)
        ghc-options:
          - -O2
          - -threaded
      - condition: "!flag(release)"
        ghc-options: -O0
    dependencies:
      - base >= 4.7 && < 5
      - unordered-containers
      - coreutils

tests:
  test:
    main: Spec.hs
    source-dirs: test
    build-tools:
      - hspec-discover:hspec-discover >= 2.11
    dependencies:
      - array
      - base >= 4.7 && < 5
      - bytestring
      - coreutils
      - directory
      - hspec
      - parsec
      - network
      - QuickCheck
      - random
      - silently
      - split
      - streaming-bytestring
      - streaming
      - temporary
      - text
      - time
      - unordered-containers
      - word8
